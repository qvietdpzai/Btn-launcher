name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 29
        run: sdkmanager "ndk;29.0.14206865"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build Debug APK
        run: ./gradlew :app_pojavlauncher:assembleFullDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-full
          path: app_pojavlauncher/build/outputs/apk/full/debug/app_pojavlauncher-full-debug.apk
