name: Release Stable

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 29
        run: sdkmanager "ndk;29.0.14206865"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build Release APK
        run: |
          ./gradlew :app_pojavlauncher:assembleFullProguardNoDebug
          cp app_pojavlauncher/build/outputs/apk/full/proguardNoDebug/app_pojavlauncher-full-proguardNoDebug.apk BtnLauncher-v1.0.0.apk

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          name: BtnLauncher v1.0.0
          body: |
            BtnLauncher v1.0.0 — stable release.

            - Full runtime (Java 8 + renderers) included
            - ZeroTier VPN button
            - AI Turbo auto-optimizer
            - Browse mods / shaders / resource packs
          files: BtnLauncher-v1.0.0.apk
