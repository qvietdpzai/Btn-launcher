name: Release Stable

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 29
        run: sdkmanager "ndk;29.0.14206865"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build Release APK
        run: |
          ./gradlew :app_pojavlauncher:assembleFullProguardNoDebug --no-daemon --stacktrace
          cp app_pojavlauncher/build/outputs/apk/full/proguardNoDebug/app_pojavlauncher-full-proguardNoDebug.apk "BtnLauncher-${GITHUB_REF_NAME}.apk"

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          name: BtnLauncher ${{ github.ref_name }}
          body: |
            BtnLauncher ${{ github.ref_name }} — stable release.

            - Full runtime (Java 8 + renderers) included
            - ZeroTier VPN button
            - AI Turbo auto-optimizer
            - Browse mods / shaders / resource packs
          files: BtnLauncher-${{ github.ref_name }}.apk
